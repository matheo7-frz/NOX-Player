plugins {
    id 'com.android.application'
}

// La clé de signature n'est JAMAIS dans le code.
// Elle vient des secrets GitHub (KEYSTORE_BASE64 + KEYSTORE_PASSWORD)
// ou d'un fichier keystore.properties local qui ne doit jamais être partagé.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ksPath = System.getenv('NOX_KEYSTORE_PATH') ?: ksProps.getProperty('storeFile')
def ksPass = System.getenv('NOX_KEYSTORE_PASSWORD') ?: ksProps.getProperty('storePassword')

android {
    namespace 'com.math0235.noxplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.math0235.noxplayer"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.4"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // Cœur natif C++ (sécurité, son, couleurs, paroles)
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    signingConfigs {
        nox {
            if (ksPath && ksPass) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'noxplayer'
                keyPassword ksPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            // Code rendu illisible (obfusqué) pour compliquer toute modification
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (ksPath && ksPass) signingConfig signingConfigs.nox
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Refuse de produire un APK officiel non signé par la clé de math_0235
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!(ksPath && ksPass)) throw new GradleException("Clé NOX Player absente : ajoute les secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD.")
    }
}
