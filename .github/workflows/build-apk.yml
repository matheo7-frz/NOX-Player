name: Build APK NOX Player

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Récupérer la clé privée (secret GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nox-player.jks"
      - name: Compiler l'APK signé
        env:
          NOX_KEYSTORE_PATH: ${{ runner.temp }}/nox-player.jks
          NOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/nox-player.jks"
      - run: cp app/build/outputs/apk/release/app-release.apk NOX-Player.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-Player-APK
          path: NOX-Player.apk
