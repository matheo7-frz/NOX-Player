name: Build APK NOX Player

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier la Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Récupérer la clé privée (secret GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nox-player.jks"
      - name: Compiler l'APK signé (JavaScript + C++)
        env:
          NOX_KEYSTORE_PATH: ${{ runner.temp }}/nox-player.jks
          NOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/nox-player.jks"
      - name: Préparer l'APK + empreinte
        run: |
          cp app/build/outputs/apk/release/app-release.apk NOX-Player.apk
          sha256sum NOX-Player.apk > NOX-Player.apk.sha256
          cat NOX-Player.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-Player-APK
          path: |
            NOX-Player.apk
            NOX-Player.apk.sha256
      - name: Publier la Release (lien de téléchargement direct)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NOX Player ${{ github.ref_name }}
          body: |
            ## 🎧 NOX Player ${{ github.ref_name }} — fait par math_0235
            **Installer :** télécharge `NOX-Player.apk` ci-dessous, ouvre-le, autorise l'installation, puis *Installer*.
            Guide complet et vérification de l'authenticité : voir le README.

            🛡️ Signé avec la clé officielle de math_0235. Copie modifiée = refuse de démarrer.
          files: |
            NOX-Player.apk
            NOX-Player.apk.sha256
